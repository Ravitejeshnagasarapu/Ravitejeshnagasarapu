<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glowLeft)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glowRight)"/>

  <!-- Subtle Top & Bottom Accent Borders -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)"/>
  <rect x="0" y="297" width="1200" height="3" fill="url(#accentGrad)" opacity="0.6"/>

  <!-- Decorative System Architecture Nodes (Left & Right) -->
  <g stroke="#1E293B" stroke-width="1.5" fill="none" opacity="0.8">
    <line x1="70" y1="70" x2="160" y2="120"/>
    <line x1="160" y1="120" x2="110" y2="210"/>
    <line x1="1130" y1="75" x2="1040" y2="135"/>
    <line x1="1040" y1="135" x2="1090" y2="225"/>
  </g>
  <circle cx="70" cy="70" r="4" fill="#3B82F6" opacity="0.7"/>
  <circle cx="160" cy="120" r="5" fill="#06B6D4" opacity="0.8"/>
  <circle cx="110" cy="210" r="3.5" fill="#64748B" opacity="0.6"/>
  <circle cx="1130" cy="75" r="4" fill="#06B6D4" opacity="0.7"/>
  <circle cx="1040" cy="135" r="5" fill="#3B82F6" opacity="0.8"/>
  <circle cx="1090" cy="225" r="3.5" fill="#64748B" opacity="0.6"/>

  <!-- Status Pill -->
  <g transform="translate(475, 42)">
    <rect width="250" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="14" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="18" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0" letter-spacing="1.2">AVAILABLE FOR OPPORTUNITIES</text>
  </g>

  <!-- Main Name -->
  <text x="600" y="132" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">
    Ravi Tejesh Nagasarapu
  </text>

  <!-- Subtitle / Role -->
  <text x="600" y="176" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#38BDF8" letter-spacing="2.5">
    BACKEND ENGINEER
  </text>

  <!-- Core Stack Bar -->
  <text x="600" y="216" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="1">
    Java  ·  Python  ·  Spring Boot  ·  FastAPI  ·  REST APIs  ·  System Design
  </text>

  <!-- Institutional & Location Footer inside Banner -->
  <text x="600" y="258" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B" letter-spacing="0.8">
    B.Tech CSE (AI) @ IIITDM Kancheepuram (2023–2027)   |   Chennai, India
  </text>
</svg>