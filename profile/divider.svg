<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6" viewBox="0 0 1200 6" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Divider</title><desc id="d">Animated section divider with a moving light beam.</desc><defs><linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6" stop-opacity="0"/><stop offset="0.5" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient><linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#e0fbff"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs><rect y="2" width="1200" height="2" fill="url(#base)"/><rect y="1" width="220" height="4" rx="2" fill="url(#beam)"><animate attributeName="x" values="-220;1200" dur="4.5s" repeatCount="indefinite"/></rect></svg>